<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蓄電池モード設定</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2733; --muted:#6b7785; --line:#d8dee4;
          --green:#2e9e5b; --econ:#2b6fd6; --danger:#c0392b;
          --cheap:#1fa35c; --normal:#4a76b8; --sel:rgba(255,193,7,.28); --selStrong:rgba(255,193,7,.55); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12181e; --card:#1b242d; --text:#e8edf2; --muted:#93a0ad; --line:#2d3945; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif; }
  main { max-width:480px; margin:0 auto; }
  h1 { font-size:1.25rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:1rem; margin:0 0 12px; }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .row label.name { width:6.5em; font-size:.95rem; }
  select, input[type=text], input[type=password] {
    font-size:1rem; padding:10px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--text); }
  select { min-width:5em; }
  .sep { color:var(--muted); }
  button.mode { width:100%; font-size:1.1rem; font-weight:700; color:#fff; border:0;
                border-radius:10px; padding:16px; cursor:pointer; margin-top:4px; }
  button.green { background:var(--green); }
  button.econ  { background:var(--econ); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { font-size:.8rem; color:var(--muted); margin:6px 0 0; line-height:1.5; }
  #status { min-height:1.5em; font-size:.95rem; line-height:1.5; }
  #status.ok { color:var(--green); } #status.err { color:var(--danger); }
  details summary { cursor:pointer; font-weight:600; }
  details .field { margin-top:12px; }
  details .field label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  details .field input { width:100%; }
  #chartCaption { font-weight:700; font-size:.95rem; margin:0 0 4px; }
  #chartMeta { font-size:.78rem; color:var(--muted); margin:0 0 8px; }
  #chart { width:100%; height:auto; display:block; touch-action:manipulation; }
  #chart text { fill:var(--muted); font-size:11px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); margin:8px 0 0; }
  .sw { display:inline-block; width:14px; height:4px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  #chartInfo { font-size:.9rem; line-height:1.6; margin-top:8px; min-height:3.2em; }
  #chartInfo .warn { color:var(--danger); }
  button.small { font-size:.8rem; padding:6px 10px; border:1px solid var(--line); border-radius:8px;
                 background:var(--bg); color:var(--text); cursor:pointer; margin-top:8px; }
  a { color:var(--econ); }
</style>
</head>
<body>
<main>
  <h1>🔋 蓄電池モード設定</h1>

  <section class="card">
    <h2>グリーンモード</h2>
    <button id="btnGreen" class="mode green">グリーンモードに設定</button>
    <p class="hint">充電時間は月に応じて自動設定されます（4〜9月 06:00〜16:00／10〜3月 06:30〜15:30）。</p>
  </section>

  <section class="card">
    <h2>経済モード</h2>
    <div class="row">
      <label class="name" for="startHour">充電開始</label>
      <select id="startHour"></select><span class="sep">時</span>
      <select id="startMinute"></select><span class="sep">分</span>
    </div>
    <div class="row">
      <label class="name" for="endHour">充電終了</label>
      <select id="endHour"></select><span class="sep">時</span>
      <select id="endMinute"></select><span class="sep">分</span>
    </div>
    <button id="btnEcon" class="mode econ">経済モードに設定</button>
  </section>

  <div class="card"><div id="status" role="status" aria-live="polite"></div></div>

  <section class="card">
    <h2>JEPX 中部エリア価格（30分コマ）</h2>
    <p id="chartCaption">読み込み中…</p>
    <p id="chartMeta"></p>
    <svg id="chart" viewBox="0 0 640 320" role="img" aria-label="中部エリアの30分コマ価格グラフ"></svg>
    <div class="legend">
      <span><i class="sw" style="background:var(--cheap)"></i>13円/kWh未満</span>
      <span><i class="sw" style="background:var(--normal)"></i>13円/kWh以上</span>
    </div>
    <div id="chartInfo">グラフをクリックすると、その時刻から充電する設定を経済モードのコンボボックスに入力します。</div>
    <button type="button" id="btnReload" class="small">価格データを再読込</button>
  </section>

  <details class="card" id="settings">
    <summary>接続設定（GitHub）</summary>
    <div class="field">
      <label for="repo">リポジトリ（オーナー/リポジトリ名）</label>
      <input type="text" id="repo" placeholder="your-name/chikuden" autocomplete="off">
    </div>
    <div class="field">
      <label for="ref">ブランチ</label>
      <input type="text" id="ref" value="main" autocomplete="off">
    </div>
    <div class="field">
      <label for="workflow">ワークフローファイル名</label>
      <input type="text" id="workflow" value="battery_setup.yml" autocomplete="off">
    </div>
    <div class="field">
      <label for="token">GitHubトークン（Actions: Read and write のみ付与したFine-grained PAT）</label>
      <input type="password" id="token" autocomplete="off">
    </div>
    <p class="hint">この端末のブラウザ(localStorage)にのみ保存されます。</p>
  </details>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KEY = "chikuden.settings.v1";
  const pad = (n) => String(n).padStart(2, "0");

  // コンボボックスの選択肢を作成
  function fill(sel, values, selected) {
    values.forEach((v) => {
      const o = document.createElement("option");
      o.value = o.textContent = v;
      if (v === selected) o.selected = true;
      sel.appendChild(o);
    });
  }
  const hours = Array.from({ length: 24 }, (_, i) => pad(i));
  const minutes = ["00", "10", "20", "30", "40", "50"];
  fill($("startHour"), hours, "05");  fill($("startMinute"), minutes, "00");
  fill($("endHour"), hours, "15");    fill($("endMinute"), minutes, "00");

  // 接続設定の保存・復元
  const fields = ["repo", "ref", "workflow", "token", "startHour", "startMinute", "endHour", "endMinute"];
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    fields.forEach((f) => { if (saved[f]) $(f).value = saved[f]; });
  } catch (e) {}
  function save() {
    try {
      const data = {};
      fields.forEach((f) => (data[f] = $(f).value));
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {}
  }
  fields.forEach((f) => $(f).addEventListener("change", save));
  if (!$("repo").value.trim() || !$("token").value.trim()) $("settings").open = true;

  function setStatus(msg, cls) {
    const el = $("status");
    el.className = cls || "";
    el.innerHTML = msg;
  }
  function setBusy(b) { $("btnGreen").disabled = b; $("btnEcon").disabled = b; }

  async function dispatch(inputs, label) {
    const repo = $("repo").value.trim();
    const token = $("token").value.trim();
    const ref = $("ref").value.trim() || "main";
    const wf = $("workflow").value.trim() || "battery_setup.yml";
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) {
      $("settings").open = true;
      setStatus("「接続設定」でリポジトリとトークンを入力してください。", "err");
      return;
    }
    save();
    setBusy(true);
    setStatus("送信中…");
    try {
      const res = await fetch(
        `https://api.github.com/repos/${repo}/actions/workflows/${encodeURIComponent(wf)}/dispatches`,
        {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ ref, inputs })
        }
      );
      if (res.status === 204) {
        setStatus(`${label}の設定をGitHub Actionsに依頼しました。` +
          `<br><a href="https://github.com/${repo}/actions/workflows/${encodeURIComponent(wf)}" target="_blank" rel="noopener">実行状況を確認</a>` +
          `（完了時にメールが届きます）`, "ok");
      } else {
        let detail = "";
        try { detail = (await res.json()).message || ""; } catch (e) {}
        setStatus(`失敗しました（HTTP ${res.status}）${detail ? "：" + detail : ""}`, "err");
      }
    } catch (e) {
      setStatus("通信エラー：" + e.message, "err");
    } finally {
      setBusy(false);
    }
  }

  $("btnGreen").addEventListener("click", () => {
    if (!confirm("グリーンモードに設定します。よろしいですか？\n（設定は即時反映されます）")) return;
    // 時刻は空欄 → Python側で月に応じて自動設定
    dispatch({ mode: "green" }, "グリーンモード");
  });

  $("btnEcon").addEventListener("click", () => {
    const sh = $("startHour").value, sm = $("startMinute").value;
    const eh = $("endHour").value, em = $("endMinute").value;
    if (`${sh}${sm}` >= `${eh}${em}`) {
      setStatus("充電終了時刻は開始時刻より後にしてください。", "err");
      return;
    }
    if (!confirm(`経済モード（充電 ${sh}:${sm} 〜 ${eh}:${em}）に設定します。よろしいですか？\n（設定は即時反映されます）`)) return;
    dispatch({ mode: "economy", start_hour: sh, start_minute: sm, end_hour: eh, end_minute: em }, "経済モード");
  });
  // ===== JEPX 中部エリア価格グラフ =====
  const THRESHOLD = 13;
  const START_OFFSET_MIN = 10;   // 蓄電池の設定にかかる時間を見込み、クリックしたコマの何分前から開始するか
  const SVGNS = "http://www.w3.org/2000/svg";
  const slotTime = (i) => (i >= 48 ? "24:00" : pad(Math.floor(i / 2)) + ":" + (i % 2 ? "30" : "00"));
  const fmtPrice = (p) => p.toFixed(2);

  // 日本時間の日付(YYYY-MM-DD)。offsetDays日後
  function jstDate(offsetDays) {
    const d = new Date(Date.now() + 9 * 3600 * 1000 + offsetDays * 86400 * 1000);
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }
  function dateLabel(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const w = "日月火水木金土"[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
    return `${y}年${m}月${d}日（${w}）`;
  }

  // クリックしたコマ(i)以降で13円未満となる最後のコマの番号を返す（無ければ -1）
  function lastCheapSlotFrom(prices, i) {
    for (let j = prices.length - 1; j >= i; j--) if (prices[j] < THRESHOLD) return j;
    return -1;
  }

  let chartState = { prices: null, sel: null };

  async function loadPrices() {
    const urls = ["jepx_chubu.json"];
    const repo = $("repo").value.trim();
    const ref = $("ref").value.trim() || "main";
    if (/^[\w.-]+\/[\w.-]+$/.test(repo)) {
      urls.push(`https://raw.githubusercontent.com/${repo}/${ref}/docs/jepx_chubu.json`);
    }
    for (const u of urls) {
      try {
        const r = await fetch(u + "?_=" + Date.now(), { cache: "no-store" });
        if (r.ok) return await r.json();
      } catch (e) {}
    }
    return null;
  }

  async function initChart() {
    const cap = $("chartCaption"), meta = $("chartMeta"), svg = $("chart");
    cap.textContent = "読み込み中…"; meta.textContent = "";
    chartState = { prices: null, sel: null };
    svg.innerHTML = "";
    const data = await loadPrices();
    if (!data || !data.days) {
      cap.textContent = "価格データを読み込めませんでした。";
      meta.textContent = "Actionsの「Fetch JEPX Chubu Prices」を一度手動実行し、反映後に再読込してください。";
      return;
    }
    const today = jstDate(0), tomorrow = jstDate(1);
    let day = null, kind = "";
    if (Array.isArray(data.days[tomorrow]) && data.days[tomorrow].length === 48) { day = tomorrow; kind = "翌日分"; }
    else if (Array.isArray(data.days[today]) && data.days[today].length === 48) { day = today; kind = "当日分・翌日分は未公表"; }
    if (!day) {
      cap.textContent = "表示できる価格データがありません（保存データが古い可能性があります）。";
      meta.textContent = data.updated ? `データ更新: ${data.updated} JST` : "";
      return;
    }
    chartState.prices = data.days[day];
    cap.textContent = `${dateLabel(day)} 中部エリア価格（${kind}）`;
    meta.textContent = (data.updated ? `データ更新: ${data.updated} JST ／ ` : "") + "単位: 円/kWh";
    drawChart();
  }

  function el(name, attrs, parent) {
    const e = document.createElementNS(SVGNS, name);
    for (const k in attrs) {
      if (k === "style") e.setAttribute("style", attrs[k]); else e.setAttribute(k, attrs[k]);
    }
    if (parent) parent.appendChild(e);
    return e;
  }

  function drawChart() {
    const prices = chartState.prices, svg = $("chart");
    svg.innerHTML = "";
    const W = 640, H = 320, L = 42, R = 12, T = 12, B = 30;
    const pw = W - L - R, ph = H - T - B;
    const maxP = Math.max(...prices, THRESHOLD + 2), minP = Math.min(0, ...prices);
    const rawStep = (maxP - minP) / 6;
    const step = [1, 2, 5, 10, 20, 50].find((s) => s >= rawStep) || 50;
    const yMax = Math.ceil(maxP / step) * step, yMin = Math.floor(minP / step) * step;
    const x = (i) => L + (pw * i) / 48;
    const y = (v) => T + ph * (1 - (v - yMin) / (yMax - yMin));

    // 目盛り
    for (let v = yMin; v <= yMax + 1e-9; v += step) {
      el("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), style: "stroke:var(--line);stroke-width:1" }, svg);
      const t = el("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }, svg);
      t.textContent = v;
    }
    for (let h = 0; h <= 24; h += 3) {
      const t = el("text", { x: x(h * 2), y: H - 10, "text-anchor": "middle" }, svg);
      t.textContent = h;
    }

    // 選択範囲(クリック位置〜終了)の帯
    if (chartState.sel) {
      const { start, endSlot } = chartState.sel; // endSlot: 終了コマ(含む)
      el("rect", { x: x(start), y: T, width: x(endSlot + 1) - x(start), height: ph, style: "fill:var(--sel)" }, svg);
      el("rect", { x: x(start), y: T, width: x(start + 1) - x(start), height: ph, style: "fill:var(--selStrong)" }, svg);
    }

    // 13円ライン
    el("line", { x1: L, x2: W - R, y1: y(THRESHOLD), y2: y(THRESHOLD),
                 style: "stroke:var(--cheap);stroke-width:1.2;stroke-dasharray:5 4" }, svg);
    const tl = el("text", { x: W - R - 2, y: y(THRESHOLD) - 4, "text-anchor": "end" }, svg);
    tl.textContent = THRESHOLD + "円";

    // 30分コマごとの階段状の線（13円未満は色を変更）
    prices.forEach((p, i) => {
      const color = p < THRESHOLD ? "var(--cheap)" : "var(--normal)";
      el("rect", { x: x(i), y: y(p), width: x(i + 1) - x(i), height: Math.max(0, y(yMin) - y(p)),
                   style: `fill:${color};opacity:.13` }, svg);
      const d = (i > 0 ? `M${x(i)},${y(prices[i - 1])} V${y(p)} ` : `M${x(i)},${y(p)} `) + `H${x(i + 1)}`;
      el("path", { d, style: `fill:none;stroke:${color};stroke-width:3;stroke-linejoin:round;stroke-linecap:round` }, svg);
    });

    // クリック判定用の透明な縦帯（各コマ）
    prices.forEach((p, i) => {
      const r = el("rect", { x: x(i), y: T, width: x(i + 1) - x(i), height: ph,
                             style: "fill:transparent;cursor:pointer" }, svg);
      const ti = el("title", {}, r);
      ti.textContent = `${slotTime(i)}〜${slotTime(i + 1)}  ${fmtPrice(p)}円/kWh`;
      r.addEventListener("click", () => onSlotClick(i));
    });
  }

  function onSlotClick(i) {
    const prices = chartState.prices;
    const p = prices[i];
    const j = lastCheapSlotFrom(prices, i);
    let endSlot, endIdx, note;
    if (j >= 0) {
      endSlot = j;
      endIdx = j + 1;                 // 終了時刻は、そのコマの終わり
      note = `13円未満の最後のコマ ${slotTime(j)}〜${slotTime(j + 1)}（${fmtPrice(prices[j])}円）`;
      if (endIdx >= 48) { endIdx = 47; note += "。終了は23:30（コンボボックスの上限）"; }
    } else {
      endSlot = i;
      endIdx = Math.min(i + 1, 47);
      note = `<span class="warn">この時刻以降に13円未満のコマがありません。終了はそのコマの終わりにしました</span>`;
    }
    if (endIdx <= i) endIdx = Math.min(i + 1, 47);

    // 開始はクリックしたコマの開始時刻の START_OFFSET_MIN 分前（0:00より前にはしない）
    const startMin = Math.max(0, i * 30 - START_OFFSET_MIN);
    const startLabel = pad(Math.floor(startMin / 60)) + ":" + pad(startMin % 60);
    $("startHour").value = pad(Math.floor(startMin / 60));
    $("startMinute").value = pad(startMin % 60);
    $("endHour").value = pad(Math.floor(endIdx / 2));
    $("endMinute").value = endIdx % 2 ? "30" : "00";
    save();

    chartState.sel = { start: i, endSlot: Math.max(endSlot, i) };
    drawChart();
    $("chartInfo").innerHTML =
      `選択: <b>${slotTime(i)}〜${slotTime(i + 1)}</b>　<b>${fmtPrice(p)}円/kWh</b>${p < THRESHOLD ? "（13円未満）" : "（13円以上）"}<br>` +
      `経済モード設定: 開始 <b>${startLabel}</b>（${START_OFFSET_MIN > 0 && i > 0 ? "コマの開始の" + START_OFFSET_MIN + "分前" : "コマの開始時刻"}） ／ 終了 <b>${slotTime(endIdx)}</b>（${note}）`;
  }

  $("btnReload").addEventListener("click", initChart);
  $("repo").addEventListener("change", initChart);
  initChart();
})();
</script>
</body>
</html>
