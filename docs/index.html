<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蓄電池モード設定</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2733; --muted:#6b7785; --line:#d8dee4;
          --green:#2e9e5b; --econ:#2b6fd6; --danger:#c0392b;
          --cheap:#1fa35c; --normal:#4a76b8; --sel:rgba(255,193,7,.28); --selStrong:rgba(255,193,7,.55); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12181e; --card:#1b242d; --text:#e8edf2; --muted:#93a0ad; --line:#2d3945; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:1.25rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:1rem; margin:0 0 12px; }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .row label.name { width:6.5em; font-size:.95rem; }
  select, input[type=text], input[type=password] {
    font-size:1rem; padding:10px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--text); }
  select { min-width:5em; }
  .sep { color:var(--muted); }
  button.mode { width:100%; font-size:1.1rem; font-weight:700; color:#fff; border:0;
                border-radius:10px; padding:16px; cursor:pointer; margin-top:4px; }
  button.green { background:var(--green); }
  button.econ  { background:var(--econ); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { font-size:.8rem; color:var(--muted); margin:6px 0 0; line-height:1.5; }
  #status { min-height:1.5em; font-size:.95rem; line-height:1.5; }
  #status.ok { color:var(--green); } #status.err { color:var(--danger); }
  details summary { cursor:pointer; font-weight:600; }
  details .field { margin-top:12px; }
  details .field label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  details .field input { width:100%; }
  #chartCaption { font-weight:700; font-size:.95rem; margin:0 0 4px; }
  #chartMeta { font-size:.78rem; color:var(--muted); margin:0 0 8px; }
  #chart { width:100%; height:auto; display:block; touch-action:manipulation; }
  #chart text { fill:var(--muted); font-size:11px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); margin:8px 0 0; }
  .sw { display:inline-block; width:14px; height:4px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  #chartInfo { font-size:.9rem; line-height:1.6; margin-top:8px; min-height:3.2em; }
  #chartInfo .warn { color:var(--danger); }
  button.small { font-size:.8rem; padding:6px 10px; border:1px solid var(--line); border-radius:8px;
                 background:var(--bg); color:var(--text); cursor:pointer; margin-top:8px; }
  a { color:var(--econ); }
  /* 予約 */
  .reserve-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .reserve-row label.chk { display:flex; align-items:center; gap:8px; font-size:1rem; font-weight:600; cursor:pointer; }
  .reserve-row input[type=checkbox] { width:22px; height:22px; }
  #reserveAt { flex:1; min-width:12em; }
  #reserveAt:disabled { opacity:.45; }
  .card.reserving { border-color:var(--econ); box-shadow:0 0 0 2px rgba(43,111,214,.25); }
  #resList { list-style:none; margin:0; padding:0; }
  #resList li { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); font-size:.9rem; line-height:1.4; }
  #resList li:first-child { border-top:0; }
  #resList .when { font-weight:700; white-space:nowrap; }
  #resList .what { flex:1; color:var(--muted); }
  #resList .st { font-size:.78rem; padding:2px 8px; border-radius:10px; border:1px solid var(--line); white-space:nowrap; }
  #resList .st.pending { color:var(--econ); border-color:var(--econ); }
  #resList .st.running { color:var(--green); border-color:var(--green); }
  #resList .st.failed, #resList .st.expired { color:var(--danger); border-color:var(--danger); }
  #resList li.past { opacity:.7; }
  #resMsg { font-size:.85rem; color:var(--muted); margin:8px 0 0; min-height:1.2em; }
  #chartWrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  #chart { min-width:640px; }
</style>
</head>
<body>
<main>
  <h1>🔋 蓄電池モード設定</h1>

  <section class="card" id="reserveCard">
    <h2>予約</h2>
    <div class="reserve-row">
      <label class="chk"><input type="checkbox" id="reserveChk">予約する</label>
      <select id="reserveAt" disabled aria-label="実行日時"></select>
    </div>
    <p class="hint" id="reserveHint">チェックを外している間は、下のボタンで即時に設定します。</p>
  </section>

  <section class="card">
    <h2>グリーンモード</h2>
    <button id="btnGreen" class="mode green">グリーンモードに設定</button>
    <p class="hint">充電時間は月に応じて自動設定されます（4〜9月 06:00〜16:00／10〜3月 06:30〜15:30）。</p>
  </section>

  <section class="card">
    <h2>経済モード</h2>
    <div class="row">
      <label class="name" for="startHour">充電開始</label>
      <select id="startHour"></select><span class="sep">時</span>
      <select id="startMinute"></select><span class="sep">分</span>
    </div>
    <div class="row">
      <label class="name" for="endHour">充電終了</label>
      <select id="endHour"></select><span class="sep">時</span>
      <select id="endMinute"></select><span class="sep">分</span>
    </div>
    <button id="btnEcon" class="mode econ">経済モードに設定</button>
  </section>

  <div class="card"><div id="status" role="status" aria-live="polite"></div></div>

  <section class="card">
    <h2>予約一覧</h2>
    <ul id="resList"><li class="what">読み込み中…</li></ul>
    <p id="resMsg"></p>
    <button type="button" id="btnResReload" class="small">予約一覧を更新</button>
  </section>

  <section class="card">
    <h2>JEPX 中部エリア価格（30分コマ）</h2>
    <p id="chartCaption">読み込み中…</p>
    <p id="chartMeta"></p>
    <div id="chartWrap"><svg id="chart" viewBox="0 0 820 340" role="img" aria-label="中部エリアの30分コマ価格グラフ（当日17時〜翌日24時）"></svg></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--cheap)"></i>13円/kWh未満</span>
      <span><i class="sw" style="background:var(--normal)"></i>13円/kWh以上</span>
    </div>
    <div id="chartInfo">グラフをクリックすると、その時刻から充電する設定を経済モードのコンボボックスに入力します。</div>
    <button type="button" id="btnReload" class="small">価格データを再読込（JEPXから取得）</button>
  </section>

  <details class="card" id="settings">
    <summary>接続設定（GitHub）</summary>
    <div class="field">
      <label for="repo">リポジトリ（オーナー/リポジトリ名）</label>
      <input type="text" id="repo" placeholder="your-name/chikuden" autocomplete="off">
    </div>
    <div class="field">
      <label for="ref">ブランチ</label>
      <input type="text" id="ref" value="main" autocomplete="off">
    </div>
    <div class="field">
      <label for="workflow">ワークフローファイル名</label>
      <input type="text" id="workflow" value="battery_setup.yml" autocomplete="off">
    </div>
    <div class="field">
      <label for="token">GitHubトークン（Actions: Read and write のみ付与したFine-grained PAT）</label>
      <input type="password" id="token" autocomplete="off">
    </div>
    <p class="hint">この端末のブラウザ(localStorage)にのみ保存されます。</p>
  </details>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KEY = "chikuden.settings.v1";
  const pad = (n) => String(n).padStart(2, "0");

  // コンボボックスの選択肢を作成
  function fill(sel, values, selected) {
    values.forEach((v) => {
      const o = document.createElement("option");
      o.value = o.textContent = v;
      if (v === selected) o.selected = true;
      sel.appendChild(o);
    });
  }
  const hours = Array.from({ length: 24 }, (_, i) => pad(i));
  const minutes = ["00", "10", "20", "30", "40", "50"];
  fill($("startHour"), hours, "05");  fill($("startMinute"), minutes, "00");
  fill($("endHour"), hours, "15");    fill($("endMinute"), minutes, "00");

  // 接続設定の保存・復元
  const fields = ["repo", "ref", "workflow", "token", "startHour", "startMinute", "endHour", "endMinute"];
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    fields.forEach((f) => { if (saved[f]) $(f).value = saved[f]; });
  } catch (e) {}
  function save() {
    try {
      const data = {};
      fields.forEach((f) => (data[f] = $(f).value));
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {}
  }
  fields.forEach((f) => $(f).addEventListener("change", save));
  if (!$("repo").value.trim() || !$("token").value.trim()) $("settings").open = true;

  function setStatus(msg, cls) {
    const el = $("status");
    el.className = cls || "";
    el.innerHTML = msg;
  }
  function setBusy(b) { $("btnGreen").disabled = b; $("btnEcon").disabled = b; }

  async function dispatch(inputs, label, opts) {
    opts = opts || {};
    const repo = $("repo").value.trim();
    const token = $("token").value.trim();
    const ref = $("ref").value.trim() || "main";
    const wf = opts.workflow || $("workflow").value.trim() || "battery_setup.yml";
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) {
      $("settings").open = true;
      setStatus("「接続設定」でリポジトリとトークンを入力してください。", "err");
      return;
    }
    save();
    setBusy(true);
    setStatus("送信中…");
    try {
      const res = await fetch(
        `https://api.github.com/repos/${repo}/actions/workflows/${encodeURIComponent(wf)}/dispatches`,
        {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ ref, inputs })
        }
      );
      if (res.status === 204 && opts.onOk) {
        opts.onOk(repo, wf);
      } else if (res.status === 204) {
        setStatus(`${label}の設定をGitHub Actionsに依頼しました。` +
          `<br><a href="https://github.com/${repo}/actions/workflows/${encodeURIComponent(wf)}" target="_blank" rel="noopener">実行状況を確認</a>` +
          `（完了時にメールが届きます）`, "ok");
      } else {
        let detail = "";
        try { detail = (await res.json()).message || ""; } catch (e) {}
        setStatus(`失敗しました（HTTP ${res.status}）${detail ? "：" + detail : ""}`, "err");
      }
    } catch (e) {
      setStatus("通信エラー：" + e.message, "err");
    } finally {
      setBusy(false);
    }
  }

  // ===== 予約 =====
  const RES_WORKFLOW = "reservation_edit.yml";
  const RES_DIR = "docs/reservations";
  const RES_STEP_MS = 30 * 60 * 1000;
  const JST_MS = 9 * 3600 * 1000;
  const WEEK = "日月火水木金土";
  const STATUS_LABEL = { pending: "予約中", running: "実行中", done: "完了", failed: "失敗", canceled: "取消", expired: "失効" };
  const MODE_NAME = { green: "グリーンモード", economy: "経済モード" };

  // JSTの壁時計 "YYYY-MM-DDTHH:MM" から表示用ラベルを作る
  function wallLabel(wall) {
    const [d, t] = wall.split("T");
    const [y, m, dd] = d.split("-").map(Number);
    const w = WEEK[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()];
    const rel = d === jstDate(0) ? "今日 " : d === jstDate(1) ? "明日 " : "";
    return `${rel}${m}/${dd}（${w}）${t}`;
  }
  function isoToWall(iso) {   // "2026-10-14T17:30+09:00" → JST壁時計
    return new Date(Date.parse(iso) + JST_MS).toISOString().slice(0, 16);
  }

  // 実行日時の候補（30分刻み。現在の5分後以降〜翌日23:30）
  function buildReserveOptions() {
    const sel = $("reserveAt"), prev = sel.value;
    const endMs = Date.parse(jstDate(2) + "T00:00:00+09:00");
    sel.innerHTML = "";
    for (let t = Math.ceil((Date.now() + 5 * 60000) / RES_STEP_MS) * RES_STEP_MS; t < endMs; t += RES_STEP_MS) {
      const wall = new Date(t + JST_MS).toISOString().slice(0, 16);
      const o = document.createElement("option");
      o.value = wall + ":00+09:00";
      o.textContent = wallLabel(wall);
      if (o.value === prev) o.selected = true;
      sel.appendChild(o);
    }
  }
  function reserving() { return $("reserveChk").checked; }
  function updateReserveUi() {
    const on = reserving();
    $("reserveAt").disabled = !on;
    $("reserveCard").classList.toggle("reserving", on);
    $("btnGreen").textContent = on ? "グリーンモードを予約" : "グリーンモードに設定";
    $("btnEcon").textContent = on ? "経済モードを予約" : "経済モードに設定";
    $("reserveHint").textContent = on
      ? "ボタンを押しても即時には設定せず、選んだ日時の予約として登録します（実行は10分ごとの確認時に行うため、数十分遅れることがあります）。"
      : "チェックを外している間は、下のボタンで即時に設定します。";
  }
  $("reserveChk").addEventListener("change", () => { buildReserveOptions(); updateReserveUi(); });
  buildReserveOptions();
  updateReserveUi();
  setInterval(buildReserveOptions, 60000);

  async function ghGet(url, raw) {
    const token = $("token").value.trim();
    const base = { "Accept": raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    for (const useToken of token ? [true, false] : [false]) {
      const headers = { ...base };
      if (useToken) headers.Authorization = `Bearer ${token}`;
      try {
        const r = await fetch(url, { headers, cache: "no-store" });
        if (r.status === 404) return { missing: true };
        if (r.ok) return { data: await r.json() };
      } catch (e) {}
    }
    return null;
  }

  // 予約ファイル(docs/reservations/*.json)を読み込む。失敗時は null
  async function loadReservations() {
    const repo = $("repo").value.trim(), ref = $("ref").value.trim() || "main";
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return null;
    const dir = await ghGet(`https://api.github.com/repos/${repo}/contents/${RES_DIR}?ref=${encodeURIComponent(ref)}`, false);
    if (!dir) return null;
    if (dir.missing) return [];
    const files = dir.data.filter((f) => f.type === "file" && f.name.endsWith(".json"));
    const recs = await Promise.all(files.map(async (f) => {
      const r = await ghGet(f.url, true);
      return r && r.data && r.data.id ? r.data : null;
    }));
    return recs.filter(Boolean);
  }

  function renderReservations(recs) {
    const ul = $("resList");
    ul.innerHTML = "";
    if (!recs) {
      ul.innerHTML = '<li class="what">予約を読み込めません（「接続設定」のリポジトリを確認してください）。</li>';
      return;
    }
    const active = recs.filter((r) => r.status === "pending" || r.status === "running")
      .sort((a, b) => Date.parse(a.run_at) - Date.parse(b.run_at));
    const past = recs.filter((r) => r.status !== "pending" && r.status !== "running" && r.status !== "canceled")
      .sort((a, b) => Date.parse(b.run_at) - Date.parse(a.run_at)).slice(0, 5);
    if (!active.length && !past.length) {
      ul.innerHTML = '<li class="what">予約はありません。</li>';
      return;
    }
    const add = (r, isPast) => {
      const li = document.createElement("li");
      if (isPast) li.className = "past";
      const when = document.createElement("span");
      when.className = "when"; when.textContent = wallLabel(isoToWall(r.run_at));
      const what = document.createElement("span");
      what.className = "what";
      const times = r.start_hour ? ` ${r.start_hour}:${r.start_minute}〜${r.end_hour}:${r.end_minute}` : "（時刻は月に応じて自動）";
      what.textContent = (MODE_NAME[r.mode] || r.mode) + times;
      const st = document.createElement("span");
      st.className = "st " + r.status; st.textContent = STATUS_LABEL[r.status] || r.status;
      li.append(when, what, st);
      if (r.status === "pending") {
        const b = document.createElement("button");
        b.type = "button"; b.className = "small"; b.style.marginTop = "0"; b.textContent = "取消";
        b.addEventListener("click", () => cancelReservation(r));
        li.appendChild(b);
      }
      ul.appendChild(li);
    };
    active.forEach((r) => add(r, false));
    past.forEach((r) => add(r, true));
  }

  const resKey = (recs) => JSON.stringify((recs || []).map((r) => r.id + ":" + r.status).sort());
  async function refreshReservations() {
    $("resMsg").textContent = "";
    const recs = await loadReservations();
    renderReservations(recs);
    return recs;
  }

  // 依頼後、予約ファイルの更新(Actionsのコミット)が見えるまで数秒おきに確認する
  async function waitReservationChange(before, doneText) {
    const msg = $("resMsg");
    msg.textContent = "予約の反映を確認しています…";
    const deadline = Date.now() + 90000;
    while (Date.now() < deadline) {
      await sleep(5000);
      const recs = await loadReservations();
      if (recs && resKey(recs) !== before) {
        renderReservations(recs);
        msg.textContent = doneText;
        return;
      }
    }
    msg.textContent = "反映を確認できませんでした。「予約一覧を更新」を押すか、Actionsの実行結果を確認してください。";
  }

  async function submitReservation(inputs, label) {
    const at = $("reserveAt").value;
    if (!at) { setStatus("実行日時を選択してください。", "err"); return; }
    const when = wallLabel(isoToWall(at));
    const detail = inputs.mode === "economy"
      ? `（充電 ${inputs.start_hour}:${inputs.start_minute} 〜 ${inputs.end_hour}:${inputs.end_minute}）` : "";
    if (!confirm(`${label}${detail}を ${when} に実行する予約をします。\n（今すぐには設定されません）よろしいですか？`)) return;
    const before = resKey(await loadReservations());
    await dispatch({ action: "add", run_at: at, ...inputs }, label + "の予約", {
      workflow: RES_WORKFLOW,
      onOk: (repo) => {
        setStatus(`${label}の予約（${when}）をGitHub Actionsに依頼しました。` +
          `<br><a href="https://github.com/${repo}/actions/workflows/${RES_WORKFLOW}" target="_blank" rel="noopener">登録状況を確認</a>`, "ok");
        waitReservationChange(before, "予約を登録しました。");
      }
    });
  }

  async function cancelReservation(r) {
    const when = wallLabel(isoToWall(r.run_at));
    if (!confirm(`${when} の${MODE_NAME[r.mode] || r.mode}の予約を取り消します。よろしいですか？`)) return;
    const before = resKey(await loadReservations());
    await dispatch({ action: "cancel", reservation_id: r.id }, "予約の取消", {
      workflow: RES_WORKFLOW,
      onOk: () => {
        setStatus("予約の取消をGitHub Actionsに依頼しました。", "ok");
        waitReservationChange(before, "予約を取り消しました。");
      }
    });
  }

  $("btnResReload").addEventListener("click", refreshReservations);

  $("btnGreen").addEventListener("click", () => {
    if (reserving()) {
      // 時刻は空欄 → 実行時にPython側で月に応じて自動設定
      submitReservation({ mode: "green" }, "グリーンモード");
      return;
    }
    if (!confirm("グリーンモードに設定します。よろしいですか？\n（設定は即時反映されます）")) return;
    dispatch({ mode: "green" }, "グリーンモード");
  });

  $("btnEcon").addEventListener("click", () => {
    const sh = $("startHour").value, sm = $("startMinute").value;
    const eh = $("endHour").value, em = $("endMinute").value;
    if (`${sh}${sm}` >= `${eh}${em}`) {
      setStatus("充電終了時刻は開始時刻より後にしてください。", "err");
      return;
    }
    const inputs = { mode: "economy", start_hour: sh, start_minute: sm, end_hour: eh, end_minute: em };
    if (reserving()) { submitReservation(inputs, "経済モード"); return; }
    if (!confirm(`経済モード（充電 ${sh}:${sm} 〜 ${eh}:${em}）に設定します。よろしいですか？\n（設定は即時反映されます）`)) return;
    dispatch(inputs, "経済モード");
  });

  // ===== JEPX 中部エリア価格グラフ（当日17:00 〜 翌日24:00） =====
  const THRESHOLD = 13;
  const START_OFFSET_MIN = 10;   // 蓄電池の設定にかかる時間を見込み、クリックしたコマの何分前から開始するか
  const RANGE_START_SLOT = 34;   // 当日の表示開始コマ（34 = 17:00）
  const SVGNS = "http://www.w3.org/2000/svg";
  const slotTime = (i) => (i >= 48 ? "24:00" : pad(Math.floor(i / 2)) + ":" + (i % 2 ? "30" : "00"));
  const fmtPrice = (p) => p.toFixed(2);
  const mdLabel = (iso) => { const [, m, d] = iso.split("-").map(Number); return `${m}/${d}`; };

  // 日本時間の日付(YYYY-MM-DD)。offsetDays日後
  function jstDate(offsetDays) {
    const d = new Date(Date.now() + 9 * 3600 * 1000 + offsetDays * 86400 * 1000);
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }
  function dateLabel(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const w = "日月火水木金土"[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
    return `${y}年${m}月${d}日（${w}）`;
  }

  // chartState.cells: 表示するコマの配列 [{ day:"YYYY-MM-DD", slot:0〜47, price }]（時系列順）
  let chartState = { cells: null, sel: null };

  async function loadPrices() {
    const urls = ["jepx_chubu.json"];
    const repo = $("repo").value.trim();
    const ref = $("ref").value.trim() || "main";
    if (/^[\w.-]+\/[\w.-]+$/.test(repo)) {
      urls.push(`https://raw.githubusercontent.com/${repo}/${ref}/docs/jepx_chubu.json`);
    }
    for (const u of urls) {
      try {
        const r = await fetch(u + "?_=" + Date.now(), { cache: "no-store" });
        if (r.ok) return await r.json();
      } catch (e) {}
    }
    return null;
  }

  async function initChart(preloaded) {
    const cap = $("chartCaption"), meta = $("chartMeta"), svg = $("chart");
    cap.textContent = "読み込み中…"; meta.textContent = "";
    chartState = { cells: null, sel: null };
    svg.innerHTML = "";
    const data = preloaded || await loadPrices();
    if (!data || !data.days) {
      cap.textContent = "価格データを読み込めませんでした。";
      meta.textContent = "Actionsの「Fetch JEPX Chubu Prices」を一度手動実行し、反映後に再読込してください。";
      return;
    }
    const today = jstDate(0), tomorrow = jstDate(1);
    const has = (d) => Array.isArray(data.days[d]) && data.days[d].length === 48;
    const cells = [];
    if (has(today)) for (let s2 = RANGE_START_SLOT; s2 < 48; s2++) cells.push({ day: today, slot: s2, price: data.days[today][s2] });
    if (has(tomorrow)) for (let s2 = 0; s2 < 48; s2++) cells.push({ day: tomorrow, slot: s2, price: data.days[tomorrow][s2] });
    if (!cells.length) {
      cap.textContent = "表示できる価格データがありません（保存データが古い可能性があります）。";
      meta.textContent = data.updated ? `データ更新: ${data.updated} JST` : "";
      return;
    }
    chartState.cells = cells;
    if (has(today) && has(tomorrow)) {
      cap.textContent = `${dateLabel(today)} 17:00 〜 ${dateLabel(tomorrow)} 24:00 中部エリア価格`;
    } else if (has(today)) {
      cap.textContent = `${dateLabel(today)} 17:00 〜 24:00 中部エリア価格（翌日分は未公表）`;
    } else {
      cap.textContent = `${dateLabel(tomorrow)} 中部エリア価格（当日分のデータなし）`;
    }
    meta.textContent = (data.updated ? `データ更新: ${data.updated} JST ／ ` : "") + "単位: 円/kWh";
    $("chartWrap").scrollLeft = 0;
    drawChart();
  }

  function el(name, attrs, parent) {
    const e = document.createElementNS(SVGNS, name);
    for (const k in attrs) {
      if (k === "style") e.setAttribute("style", attrs[k]); else e.setAttribute(k, attrs[k]);
    }
    if (parent) parent.appendChild(e);
    return e;
  }

  function drawChart() {
    const cells = chartState.cells, svg = $("chart");
    svg.innerHTML = "";
    const prices = cells.map((c) => c.price), N = cells.length;
    const W = 820, H = 340, L = 42, R = 12, T = 12, B = 46;
    const pw = W - L - R, ph = H - T - B;
    const maxP = Math.max(...prices, THRESHOLD + 2), minP = Math.min(0, ...prices);
    const rawStep = (maxP - minP) / 6;
    const step = [1, 2, 5, 10, 20, 50].find((s) => s >= rawStep) || 50;
    const yMax = Math.ceil(maxP / step) * step, yMin = Math.floor(minP / step) * step;
    const x = (k) => L + (pw * k) / N;
    const y = (v) => T + ph * (1 - (v - yMin) / (yMax - yMin));

    // 縦軸の目盛り
    for (let v = yMin; v <= yMax + 1e-9; v += step) {
      el("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), style: "stroke:var(--line);stroke-width:1" }, svg);
      const t = el("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }, svg);
      t.textContent = v;
    }

    // 横軸: 3時間ごとの時刻（先頭は17時、右端は24時）。日付の境目に縦線、下段に日付
    cells.forEach((c, k) => {
      if (c.slot % 6 === 0 || k === 0) {
        const t = el("text", { x: x(k), y: H - 26, "text-anchor": "middle" }, svg);
        t.textContent = c.slot === 0 && k > 0 ? "0" : c.slot / 2;
      }
      if (c.slot === 0 && k > 0) {
        el("line", { x1: x(k), x2: x(k), y1: T, y2: H - B + 14, style: "stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3" }, svg);
      }
    });
    const lastCell = cells[N - 1];
    if (lastCell.slot === 47) {
      const t = el("text", { x: x(N), y: H - 26, "text-anchor": "middle" }, svg);
      t.textContent = "24";
    }
    let gs = 0;
    for (let k = 1; k <= N; k++) {
      if (k === N || cells[k].day !== cells[gs].day) {
        const t = el("text", { x: (x(gs) + x(k)) / 2, y: H - 8, "text-anchor": "middle" }, svg);
        t.style.fontWeight = "700";
        t.textContent = `${mdLabel(cells[gs].day)}（${"日月火水木金土"[new Date(cells[gs].day + "T00:00:00Z").getUTCDay()]}）`;
        gs = k;
      }
    }

    // 選択範囲(クリック位置〜終了)の帯
    if (chartState.sel) {
      const { start, end } = chartState.sel; // end: 終了コマ(含む)
      el("rect", { x: x(start), y: T, width: x(end + 1) - x(start), height: ph, style: "fill:var(--sel)" }, svg);
      el("rect", { x: x(start), y: T, width: x(start + 1) - x(start), height: ph, style: "fill:var(--selStrong)" }, svg);
    }

    // 13円ライン
    el("line", { x1: L, x2: W - R, y1: y(THRESHOLD), y2: y(THRESHOLD),
                 style: "stroke:var(--cheap);stroke-width:1.2;stroke-dasharray:5 4" }, svg);
    const tl = el("text", { x: W - R - 2, y: y(THRESHOLD) - 4, "text-anchor": "end" }, svg);
    tl.textContent = THRESHOLD + "円";

    // 30分コマごとの階段状の線（13円未満は色を変更）
    prices.forEach((p, k) => {
      const color = p < THRESHOLD ? "var(--cheap)" : "var(--normal)";
      el("rect", { x: x(k), y: y(p), width: x(k + 1) - x(k), height: Math.max(0, y(yMin) - y(p)),
                   style: `fill:${color};opacity:.13` }, svg);
      const d = (k > 0 ? `M${x(k)},${y(prices[k - 1])} V${y(p)} ` : `M${x(k)},${y(p)} `) + `H${x(k + 1)}`;
      el("path", { d, style: `fill:none;stroke:${color};stroke-width:3;stroke-linejoin:round;stroke-linecap:round` }, svg);
    });

    // クリック判定用の透明な縦帯（各コマ）
    cells.forEach((c, k) => {
      const r = el("rect", { x: x(k), y: T, width: x(k + 1) - x(k), height: ph,
                             style: "fill:transparent;cursor:pointer" }, svg);
      const ti = el("title", {}, r);
      ti.textContent = `${mdLabel(c.day)} ${slotTime(c.slot)}〜${slotTime(c.slot + 1)}  ${fmtPrice(c.price)}円/kWh`;
      r.addEventListener("click", () => onSlotClick(k));
    });
  }

  function onSlotClick(k) {
    const cells = chartState.cells;
    const c = cells[k], i = c.slot, p = c.price;
    // 蓄電池の充電時間は同じ日の中でしか設定できないため、クリックしたコマと同じ日の中で
    // 「クリック以降で13円未満となる最後のコマ」を探す
    let j = -1;
    for (let m = cells.length - 1; m >= k; m--) {
      if (cells[m].day === c.day && cells[m].price < THRESHOLD) { j = m; break; }
    }
    let endK, endIdx, note;
    if (j >= 0) {
      endK = j;
      endIdx = cells[j].slot + 1;     // 終了時刻は、そのコマの終わり
      note = `13円未満の最後のコマ ${slotTime(cells[j].slot)}〜${slotTime(cells[j].slot + 1)}（${fmtPrice(cells[j].price)}円）`;
      if (endIdx >= 48) { endIdx = 47; note += "。終了は23:30（日付をまたいで設定できないため）"; }
    } else {
      endK = k;
      endIdx = Math.min(i + 1, 47);
      note = `<span class="warn">この日のこの時刻以降に13円未満のコマがありません。終了はそのコマの終わりにしました</span>`;
    }
    if (endIdx <= i) endIdx = Math.min(i + 1, 47);

    // 開始はクリックしたコマの開始時刻の START_OFFSET_MIN 分前（0:00より前にはしない）
    const startMin = Math.max(0, i * 30 - START_OFFSET_MIN);
    const startLabel = pad(Math.floor(startMin / 60)) + ":" + pad(startMin % 60);
    $("startHour").value = pad(Math.floor(startMin / 60));
    $("startMinute").value = pad(startMin % 60);
    $("endHour").value = pad(Math.floor(endIdx / 2));
    $("endMinute").value = endIdx % 2 ? "30" : "00";
    save();

    chartState.sel = { start: k, end: Math.max(endK, k) };
    drawChart();
    $("chartInfo").innerHTML =
      `選択: <b>${mdLabel(c.day)} ${slotTime(i)}〜${slotTime(i + 1)}</b>　<b>${fmtPrice(p)}円/kWh</b>${p < THRESHOLD ? "（13円未満）" : "（13円以上）"}<br>` +
      `経済モード設定: 開始 <b>${startLabel}</b>（${START_OFFSET_MIN > 0 && i > 0 ? "コマの開始の" + START_OFFSET_MIN + "分前" : "コマの開始時刻"}） ／ 終了 <b>${slotTime(endIdx)}</b>（${note}）`;
  }

  // ===== JEPXから最新価格を取得して再表示 =====
  // ブラウザからjepx.jpへ直接アクセスできない(CORS)ため、取得用ワークフローをActionsで実行し、
  // 完了後に保存されたJSONをGitHub APIから読み直す。
  const FETCH_WORKFLOW = "fetch_jepx.yml";
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function loadPricesViaApi() {
    const repo = $("repo").value.trim(), ref = $("ref").value.trim() || "main", token = $("token").value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return null;
    const url = `https://api.github.com/repos/${repo}/contents/docs/jepx_chubu.json?ref=${encodeURIComponent(ref)}`;
    // トークンが無効でも公開リポジトリは読めるよう、トークン無しでも再試行する
    for (const useToken of token ? [true, false] : [false]) {
      const headers = { "Accept": "application/vnd.github.raw+json", "X-GitHub-Api-Version": "2022-11-28" };
      if (useToken) headers.Authorization = `Bearer ${token}`;
      try {
        const r = await fetch(url, { headers, cache: "no-store" });
        if (r.ok) return await r.json();
      } catch (e) {}
    }
    return null;
  }

  async function refreshFromJepx() {
    const repo = $("repo").value.trim(), ref = $("ref").value.trim() || "main", token = $("token").value.trim();
    const info = $("chartInfo"), btn = $("btnReload");
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) {
      $("settings").open = true;
      info.innerHTML = `<span class="warn">JEPXから取得するには「接続設定」でリポジトリとトークンを入力してください。</span>`;
      return;
    }
    save();
    const api = `https://api.github.com/repos/${repo}/actions/workflows/${encodeURIComponent(FETCH_WORKFLOW)}`;
    const h = { "Accept": "application/vnd.github+json", "Authorization": `Bearer ${token}`, "X-GitHub-Api-Version": "2022-11-28" };
    btn.disabled = true;
    try {
      info.textContent = "JEPXの最新データ取得をGitHub Actionsに依頼しています…";
      // 依頼前の最新の実行IDを控え、それより新しい実行を自分の依頼分として待つ
      let lastId = 0;
      const r0 = await fetch(`${api}/runs?per_page=1`, { headers: h, cache: "no-store" });
      if (r0.ok) { const j = await r0.json(); lastId = (j.workflow_runs[0] || {}).id || 0; }

      const rd = await fetch(`${api}/dispatches`, {
        method: "POST", headers: { ...h, "Content-Type": "application/json" }, body: JSON.stringify({ ref })
      });
      if (rd.status !== 204) {
        let detail = ""; try { detail = (await rd.json()).message || ""; } catch (e) {}
        info.innerHTML = `<span class="warn">取得の依頼に失敗しました（HTTP ${rd.status}）${detail ? "：" + detail : ""}</span>`;
        return;
      }

      let run = null;
      const deadline = Date.now() + 150000;
      while (Date.now() < deadline) {
        await sleep(3000);
        try {
          const r = await fetch(`${api}/runs?per_page=5`, { headers: h, cache: "no-store" });
          if (!r.ok) continue;
          const j = await r.json();
          run = j.workflow_runs.find((x) => x.id > lastId && x.event === "workflow_dispatch") || null;
          if (run) {
            info.textContent = "JEPXから取得中…（" + (run.status === "completed" ? "完了" : "実行中") + "）";
            if (run.status === "completed") break;
          }
        } catch (e) {}
      }

      if (!run || run.status !== "completed") {
        info.innerHTML = `<span class="warn">取得の完了を確認できませんでした。</span> <a href="https://github.com/${repo}/actions/workflows/${encodeURIComponent(FETCH_WORKFLOW)}" target="_blank" rel="noopener">Actionsの実行状況</a>を確認してください。`;
        return;
      }
      if (run.conclusion !== "success") {
        info.innerHTML = `<span class="warn">JEPXからの取得に失敗しました（${run.conclusion}）。</span> <a href="${run.html_url}" target="_blank" rel="noopener">実行ログを確認</a>`;
        return;
      }

      // 保存されたJSONをAPI経由で読み直して再表示（Pagesの反映待ちを避ける）
      const data = await loadPricesViaApi();
      await initChart(data || undefined);
      info.textContent = "JEPXの最新データを取得して再表示しました。";
    } catch (e) {
      info.innerHTML = `<span class="warn">通信エラー：${e.message}</span>`;
    } finally {
      btn.disabled = false;
    }
  }

  $("btnReload").addEventListener("click", refreshFromJepx);
  $("repo").addEventListener("change", () => { initChart(); refreshReservations(); });
  initChart();
  refreshReservations();
})();
</script>
</body>
</html>
